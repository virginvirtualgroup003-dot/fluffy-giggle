name: Apply passenger realism v1

on:
  push:
    branches:
      - realism-passenger-v1
    paths:
      - scripts/apply-passenger-realism-v1.mjs
      - .github/workflows/apply-passenger-realism-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout passenger realism branch
        uses: actions/checkout@v4
        with:
          ref: realism-passenger-v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply passenger realism migration
        run: node scripts/apply-passenger-realism-v1.mjs

      - name: Run passenger realism tests
        run: node --test tests/aerodesk-passenger-realism.test.mjs

      - name: Run complete regression suite
        run: node --test tests/*.test.mjs

      - name: Validate AeroDesk JSX
        run: npx --yes esbuild aerodesk.jsx --bundle --loader:.jsx=jsx --external:react --external:recharts --external:lucide-react --outfile=/tmp/aerodesk-check.js

      - name: Validate diff hygiene
        run: git diff --check

      - name: Commit validated passenger realism source
        run: |
          rm -f scripts/apply-passenger-realism-v1.mjs
          rm -f .github/workflows/apply-passenger-realism-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add passenger booking and denied boarding realism"
          git push origin HEAD:realism-passenger-v1
