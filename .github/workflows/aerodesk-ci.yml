name: AeroDesk CI

on:
  push:
    paths:
      - aerodesk.jsx
      - tests/**
      - .github/workflows/aerodesk-ci.yml
  pull_request:
    paths:
      - aerodesk.jsx
      - tests/**
      - .github/workflows/aerodesk-ci.yml

permissions:
  contents: read

concurrency:
  group: aerodesk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run engine regression tests
        run: node --test tests/aerodesk-engine.test.mjs

      - name: Validate AeroDesk JSX
        run: npx --yes esbuild aerodesk.jsx --bundle --loader:.jsx=jsx --external:react --external:recharts --external:lucide-react --outfile=/tmp/aerodesk-check.js
