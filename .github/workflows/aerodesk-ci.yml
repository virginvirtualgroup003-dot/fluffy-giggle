name: AeroDesk CI

on:
  push:
    paths:
      - aerodesk.jsx
      - .github/workflows/aerodesk-ci.yml
  pull_request:
    paths:
      - aerodesk.jsx
      - .github/workflows/aerodesk-ci.yml

permissions:
  contents: read

jobs:
  validate-jsx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate AeroDesk JSX
        run: npx --yes esbuild aerodesk.jsx --bundle --loader:.jsx=jsx --external:react --external:recharts --external:lucide-react --outfile=/tmp/aerodesk-check.js
