name: Apply AeroDesk realism phase 13

on:
  push:
    branches:
      - realism-phase13-crew-staffing
    paths:
      - scripts/apply-realism-phase13.mjs
      - .github/workflows/apply-realism-phase13.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout realism branch
        uses: actions/checkout@v4
        with:
          ref: realism-phase13-crew-staffing

      - name: Apply phase 13 realism upgrade
        run: node scripts/apply-realism-phase13.mjs

      - name: Remove obsolete one-shot migration workflows
        run: |
          rm -f .github/workflows/apply-realism-upgrade.yml
          rm -f .github/workflows/apply-realism-phase*.yml

      - name: Run complete regression suite
        run: node --test tests/*.test.mjs

      - name: Validate JSX bundle
        run: npx --yes esbuild aerodesk.jsx --bundle --loader:.jsx=jsx --external:react --external:recharts --external:lucide-react --outfile=/tmp/aerodesk-check.js

      - name: Commit upgraded AeroDesk source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aerodesk.jsx .github/workflows
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "feat: add finite crew staffing realism"
            git push origin HEAD:realism-phase13-crew-staffing
          fi
