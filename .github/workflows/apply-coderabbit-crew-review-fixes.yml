name: Apply CodeRabbit Crew Review Fixes

on:
  push:
    branches:
      - coderabbit-crew-review-fixes
    paths:
      - scripts/apply-coderabbit-crew-review-fixes.mjs
      - .github/workflows/apply-coderabbit-crew-review-fixes.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: apply-coderabbit-crew-review-fixes
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coderabbit-crew-review-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply review patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/aerodesk-crew-staffing.test.mjs')
          s = p.read_text()
          needle = "actionHireCrew: typeof actionHireCrew === 'function' ? actionHireCrew : undefined,"
          insert = needle + "\\n    ensureStaffing: typeof ensureStaffing === 'function' ? ensureStaffing : undefined,"
          if "ensureStaffing: typeof ensureStaffing" not in s:
              if needle not in s:
                  raise SystemExit('crew harness marker missing')
              s = s.replace(needle, insert, 1)
              p.write_text(s)
          PY
          node scripts/apply-coderabbit-crew-review-fixes.mjs
      - name: Remove temporary automation
        run: |
          rm -f scripts/apply-coderabbit-crew-review-fixes.mjs
          rm -f .github/workflows/apply-coderabbit-crew-review-fixes.yml
      - name: Run tests
        run: node --test tests/*.test.mjs
      - name: Validate JSX bundle
        run: |
          corepack enable
          pnpm dlx esbuild aerodesk.jsx --bundle --loader:.jsx=jsx --external:react --external:recharts --external:lucide-react --outfile=/tmp/aerodesk-coderabbit-fixes-check.js
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aerodesk.jsx tests/aerodesk-crew-staffing.test.mjs tests/aerodesk-engine.test.mjs scripts/apply-coderabbit-crew-review-fixes.mjs .github/workflows/apply-coderabbit-crew-review-fixes.yml
          git commit -m "fix: address crew staffing review findings"
          git push origin HEAD:coderabbit-crew-review-fixes
