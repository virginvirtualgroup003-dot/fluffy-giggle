name: Apply AeroDesk V3 repair

on:
  push:
    branches:
      - fix/aerodesk-v3-accounting-runtime
    paths:
      - scripts/apply-aerodesk-v3-fixes.mjs
      - .github/workflows/apply-aerodesk-v3-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/aerodesk-v3-accounting-runtime

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic repair
        run: node scripts/apply-aerodesk-v3-fixes.mjs

      - name: Validate JSX syntax
        run: npx --yes esbuild aerodesk.jsx --bundle --loader:.jsx=jsx --external:react --external:recharts --external:lucide-react --outfile=/tmp/aerodesk-check.js

      - name: Commit repaired AeroDesk source
        run: |
          if git diff --quiet -- aerodesk.jsx; then
            echo "No AeroDesk source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aerodesk.jsx
          git commit -m "fix: repair AeroDesk V3 runtime and accounting"
          git push origin HEAD:fix/aerodesk-v3-accounting-runtime
